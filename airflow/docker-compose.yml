# Single-container Airflow (standalone, SQLite metadata) for a small VPS. UI bound to localhost only.
services:
  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    ports: ["127.0.0.1:8085:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb"
      AIRFLOW__WEBSERVER__BASE_URL: "https://andriarezki.tech/dwh/airflow"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    volumes:
      - ./dags:/opt/airflow/dags
      - ..:/opt/football-dwh:ro
    mem_limit: 2g
